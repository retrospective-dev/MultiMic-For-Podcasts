name: Build

# Every push runs the tests and builds the app. A release is published only
# when the version in multimic/__init__.py changes, or when the workflow is
# started by hand (Actions > Build > Run workflow).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install numpy soundfile pytest
      - run: pytest -q tests

  gui-smoke:
    # drives the real window against fake audio devices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: pip install numpy soundfile sv-ttk
      - run: xvfb-run -a -s "-screen 0 1400x900x24" python tests/gui_smoke.py

  windows:
    needs: [test, gui-smoke]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Check the app starts
        # CI machines have no sound card, so only report problems here
        continue-on-error: true
        run: python launch.py --list

      - name: Version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python tools/version.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app (one folder, starts faster than a single exe)
        run: pyinstaller --noconfirm --windowed --name MultiMic --icon multimic.ico --add-data "multimic.ico;." --collect-data sv_ttk launch.py
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/MultiMic -DestinationPath dist/MultiMic-portable.zip
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v5
        with:
          name: MultiMic-${{ steps.version.outputs.version }}
          path: |
            dist/MultiMic-Setup.exe
            dist/MultiMic-portable.zip

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && steps.version.outputs.new == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: MultiMic ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            **MultiMic-Setup.exe**: installs MultiMic with a Start menu entry (no admin rights needed).
            **MultiMic-portable.zip**: unzip anywhere and run MultiMic.exe inside the folder.

            Windows may warn that the app is from an unknown publisher the first time; click *More info > Run anyway*.
          files: |
            dist/MultiMic-Setup.exe
            dist/MultiMic-portable.zip
          make_latest: true
