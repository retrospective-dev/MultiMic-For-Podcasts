name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install numpy soundfile pytest
      - run: pytest -q tests

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Check the app starts
        # CI machines have no sound card, so only report problems here
        continue-on-error: true
        run: python multimic.py --list
      - run: pyinstaller --noconfirm --onefile --windowed --name MultiMic --icon multimic.ico --add-data "multimic.ico;." --collect-data sv_ttk multimic.py
      - uses: actions/upload-artifact@v5
        with:
          name: MultiMic
          path: dist/MultiMic.exe
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: MultiMic ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          body: Download MultiMic.exe below and run it. No install needed.
          files: dist/MultiMic.exe
          make_latest: true
